<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      user-select: none;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #ff5a00;
      font-weight: 700;
    }
    .select-box {
      position: relative;
      border: 1px solid #767676;
      border-radius: 8px;
      padding: 6px 10px;
      background: #ffffff;
    }
    .select-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    select {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      color: #222;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      padding-right: 24px;
      font-family: inherit;
    }
    .arrow {
      position: absolute;
      right: 0;
      pointer-events: none;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 5px solid #555;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      color: #28a745;
      min-height: 14px;
      text-align: center;
      font-weight: 600;
    }
    .footer-brand {
      margin-top: 6px;
      text-align: center;
      font-size: 10px;
    }
    .footer-brand a {
      color: #999;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .footer-brand a:hover {
      color: #ff5a00;
    }
  </style>
</head>
<body>
  <h3>sortR - allegro:</h3>
  <div class="select-box">
    <div class="select-wrapper">
      <select id="sortSelect">
        <option value="t">trafność: największa</option>
        <option value="p">cena: od najniższej</option>
        <option value="pd">cena: od najwyższej</option>
        <option value="d">cena z dostawą: od najniższej</option>
        <option value="dd">cena z dostawą: od najwyższej</option>
        <option value="qd">popularność: największa</option>
        <option value="e">czas do końca: najmniej</option>
        <option value="n">czas dodania: najnowsze</option>
        <option value="r">ocena produktu: najwyższa</option>
      </select>
      <div class="arrow"></div>
    </div>
  </div>
  <div class="status" id="statusMsg"></div>
  <div class="footer-brand">
    <a href="https://rrdev.app" target="_blank">by RR-DEV</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
